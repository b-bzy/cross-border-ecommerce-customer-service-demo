[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-support-demo"
version = "0.1.0"
description = "Synthetic-data cross-border e-commerce customer-service Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "mcp>=1.7.0,<2.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
commerce-support-eval = "commerce_support_demo.evals:main"
commerce-support-smoke = "commerce_support_demo.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
